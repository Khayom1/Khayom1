<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">VEYROST Technology Lab — animated profile banner</title>
<desc id="desc">Electric blue liquid neon waves above a deep GitHub-style navy panel with a cycling terminal typewriter headline.</desc>
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#050b18"/>
    <stop offset=".58" stop-color="#071326"/>
    <stop offset=".59" stop-color="#0d1117"/>
    <stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0755ff"/>
    <stop offset=".48" stop-color="#00d9ff"/>
    <stop offset="1" stop-color="#174dff"/>
  </linearGradient>
  <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0037a8" stop-opacity=".2"/>
    <stop offset=".5" stop-color="#00baff" stop-opacity=".9"/>
    <stop offset="1" stop-color="#0037a8" stop-opacity=".2"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-100%" width="160%" height="300%">
    <feGaussianBlur stdDeviation="9" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="typeArea"><rect x="0" y="0" width="1040" height="66"/></clipPath>
</defs>
<rect width="1200" height="360" rx="16" fill="url(#base)"/>
<!-- Upper liquid neon field -->
<g>
  <path d="M-40 70 C130 0 220 130 370 78 S650 15 810 80 S1060 125 1240 38" fill="none" stroke="#064cff" stroke-width="30" opacity=".24" filter="url(#glow)"/>
  <path d="M-40 70 C130 0 220 130 370 78 S650 15 810 80 S1060 125 1240 38" fill="none" stroke="url(#waveA)" stroke-width="8" opacity=".95" filter="url(#glow)">
    <animate attributeName="d" dur="10s" repeatCount="indefinite" values="M-40 70 C130 0 220 130 370 78 S650 15 810 80 S1060 125 1240 38;M-40 92 C120 145 230 5 390 65 S660 130 820 55 S1080 5 1240 78;M-40 70 C130 0 220 130 370 78 S650 15 810 80 S1060 125 1240 38"/>
  </path>
  <path d="M-40 150 C130 85 245 180 400 132 S670 95 820 145 S1080 175 1240 115" fill="none" stroke="url(#waveB)" stroke-width="18" opacity=".75" filter="url(#glow)">
    <animate attributeName="d" dur="12s" repeatCount="indefinite" values="M-40 150 C130 85 245 180 400 132 S670 95 820 145 S1080 175 1240 115;M-40 132 C120 190 250 90 410 145 S670 185 830 120 S1080 90 1240 150;M-40 150 C130 85 245 180 400 132 S670 95 820 145 S1080 175 1240 115"/>
  </path>
  <path d="M-40 190 C150 140 250 220 420 180 S700 145 860 190 S1080 215 1240 165" fill="none" stroke="#087cff" stroke-width="3" opacity=".8">
    <animate attributeName="d" dur="14s" repeatCount="indefinite" values="M-40 190 C150 140 250 220 420 180 S700 145 860 190 S1080 215 1240 165;M-40 175 C150 225 260 145 430 190 S700 220 870 170 S1080 145 1240 195;M-40 190 C150 140 250 220 420 180 S700 145 860 190 S1080 215 1240 165"/>
  </path>
  <rect y="0" width="1200" height="205" fill="url(#base)" opacity=".08"/>
</g>
<!-- Transition into GitHub dark panel -->
<path d="M0 205 C240 198 390 211 600 204 S970 199 1200 205 L1200 360 L0 360Z" fill="#0d1117"/>
<path d="M0 205 C240 198 390 211 600 204 S970 199 1200 205" fill="none" stroke="#123a67" stroke-width="1.5" opacity=".8"/>
<g font-family="Consolas, 'Liberation Mono', monospace" text-anchor="middle">
  <text x="600" y="248" fill="#168bff" font-size="14" letter-spacing="4" opacity=".9">SYSTEM / IDENTITY</text>
  <g clip-path="url(#typeArea)" transform="translate(80 263)">
    <g class="line l1"><text x="520" y="0">SYSTEM INITIALIZING...</text></g>
    <g class="line l2"><text x="520" y="0"><tspan fill="#168bff">VEYROST</tspan><tspan fill="#e6edf3"> | TECHNOLOGY LAB</tspan></text></g>
    <g class="line l3"><text x="520" y="0" fill="#e6edf3">DREAM. CODE. INNOVATE.</text></g>
    <g class="line l4"><text x="520" y="0" fill="#168bff">AI • SOFTWARE • AUTOMATION</text></g>
    <g class="line l5"><text x="520" y="0" fill="#e6edf3">KHAYOM ABDURAHMONOV</text></g>
    <g class="line l6"><text x="520" y="0" fill="#168bff">FOUNDER &amp; INDEPENDENT DEVELOPER</text></g>
  </g>
  <text x="600" y="327" fill="#7d8590" font-size="11" letter-spacing="3">TAJIKISTAN  ·  BUILDING IDEAS INTO REALITY</text>
</g>
<style>
.line { opacity:0; }
.line text { font-size:27px; font-weight:700; }
.l1 { animation: show 18s steps(24,end) infinite; }
.l2 { animation: show 18s steps(25,end) -3s infinite; }
.l3 { animation: show 18s steps(23,end) -6s infinite; }
.l4 { animation: show 18s steps(26,end) -9s infinite; }
.l5 { animation: show 18s steps(21,end) -12s infinite; }
.l6 { animation: show 18s steps(34,end) -15s infinite; }
@keyframes show {
  0% { opacity:1; clip-path:inset(0 100% 0 0); }
  13% { opacity:1; clip-path:inset(0 0 0 0); }
  23% { opacity:1; clip-path:inset(0 0 0 0); }
  36% { opacity:1; clip-path:inset(0 100% 0 0); }
  37%,100% { opacity:0; clip-path:inset(0 100% 0 0); }
}
</style>
</svg>